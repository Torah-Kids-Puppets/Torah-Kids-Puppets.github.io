<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO & Social Media Meta Tags -->
    <title>Torah Kids Puppets - Aprende Torá Jugando</title>
    <meta name="description" content="Únete a Yosef, Benny y todo el elenco en una aventura educativa judía. Videos, parashot, trivias y valores para niños.">
    <meta name="keywords" content="Torá, Niños, Judío, Educación, Parashá, Títeres, Videos, Juegos">
    <meta name="author" content="Torah Kids Puppets">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Torah Kids Puppets - Aprende Torá Jugando">
    <meta property="og:description" content="¡Diversión y valores! Aprende la Parashá, celebra las fiestas y juega con Yosef y Benny.">
    <meta property="og:image" content="./img/logo.png"> <!-- Ruta relativa ./ -->
    <meta property="og:url" content="https://torahkidspuppets.com">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Torah Kids Puppets">
    <meta name="twitter:description" content="Educación judía divertida para niños con títeres y humor.">
    <meta name="twitter:image" content="./img/logo.png"> <!-- Ruta relativa ./ -->

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./img/logo.png"> <!-- Ruta relativa ./ -->
    
    <!-- Fonts: Fredoka (Titles) and Quicksand (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN para simplicidad en desarrollo) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Primary
              'torah-blue-deep': '#0A3A66', // Tradition, stability
              'torah-blue-light': '#67A6D8', // Friendly, bright
              'torah-gold': '#F5C463', // Light, mitzvot
              
              // Secondary
              'torah-green': '#8ECF9D', // Joy
              'torah-orange': '#F59A50', // Warmth
              'torah-pink': '#E56D88', // Raspberry
              'torah-purple': '#9C89D9', // Soft purple
              'torah-teal': '#4FD1C5', // Extra accent

              // Backgrounds
              'torah-ivory': '#FFF7E9', // General background
              'torah-white': '#FFFFFF', // Cards
              
              // Holidays
              'holiday-hanukkah': '#3366CC',
              'holiday-pesach': '#D94545',
              'holiday-sukkot': '#4BA765',
            },
            fontFamily: {
              'display': ['Fredoka', 'cursive'],
              'body': ['Quicksand', 'sans-serif'],
            },
            animation: {
              'bounce-slow': 'bounce 3s infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'pop': 'pop 0.3s ease-out forwards',
              'blob': 'blob 7s infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              pop: {
                '0%': { transform: 'scale(0.9)' },
                '50%': { transform: 'scale(1.05)' },
                '100%': { transform: 'scale(1)' },
              },
              blob: {
                "0%": { transform: "translate(0px, 0px) scale(1)" },
                "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                "100%": { transform: "translate(0px, 0px) scale(1)" }
              },
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" }
              },
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FFF7E9; /* torah-ivory */
        font-family: 'Quicksand', sans-serif;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Fredoka', cursive;
      }
      
      /* Custom scrollbar for playful look */
      .custom-scrollbar::-webkit-scrollbar {
        width: 14px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #141414;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #333;
        border-radius: 20px;
        border: 2px solid #141414;
      }

      /* Global Scrollbar */
      ::-webkit-scrollbar {
        width: 14px;
      }
      ::-webkit-scrollbar-track {
        background: #FFF7E9;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #F5C463;
        border-radius: 20px;
        border: 4px solid #FFF7E9;
      }
      
      /* Pattern overlay */
      .bg-pattern {
        background-image: radial-gradient(#F5C463 1px, transparent 1px);
        background-size: 20px 20px;
        opacity: 0.4;
      }

      /* Utilities */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "vite": "https://aistudiocdn.com/vite@^7.2.6",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1"
  }
}
</script>

</head>
